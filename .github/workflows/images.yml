name: Images

# Production images for the server, pushed to GHCR once CI passes on main. The server can
# pull these (IMAGE_PREFIX/IMAGE_TAG in deploy/compose.env) or build its own.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: api, context: backend }
          - { name: web, context: frontend }
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI tested, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: echo "SHA=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"
      # Image names must be lower case; the owner (Breadstick-Crumbs) isn't.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: true
          # The browser Sentry DSN is public; set it as a repository variable to turn it on.
          build-args: |
            APP_RELEASE=${{ env.SHA }}
            VITE_APP_RELEASE=${{ env.SHA }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          tags: |
            ghcr.io/${{ env.OWNER }}/lead-platform-${{ matrix.image.name }}:${{ env.SHA }}
            ghcr.io/${{ env.OWNER }}/lead-platform-${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
