# Local stack: postgres, the API, the job worker and the dashboard.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
      POSTGRES_DB: leads
    # Host port 5442 avoids clashing with other local Postgres instances.
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://leads:leads@postgres:5432/leads
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://leads:leads@postgres:5432/leads
    # Runs queued jobs (webhook parsing, transcription, mailbox polls) and the periodic poller.
    command: ["/app/.venv/bin/procrastinate", "--app=app.workers.app.app", "worker"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["8088:80"]
    depends_on: [api]

volumes:
  pgdata:
