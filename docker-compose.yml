# Local stack: postgres, the API, the job worker and the dashboard.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17  # Postgres 17 with the pgvector extension
    restart: unless-stopped
    environment:
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
      POSTGRES_DB: leads
    # Host port 5442 avoids clashing with other local Postgres instances.
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://leads:leads@postgres:5432/leads
    ports: ["8000:8000"]
    networks:
      default:
        aliases: [lead-platform-api]  # the name frontend/nginx.conf proxies to
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://leads:leads@postgres:5432/leads
    # Runs queued jobs (webhook parsing, transcription, mailbox polls) and the periodic poller.
    command: ["procrastinate", "--app=app.workers.worker.app", "worker"]
    # The image's check is the API's HTTP endpoint; the worker has none.
    healthcheck:
      test: ["CMD", "procrastinate", "--app=app.workers.worker.app", "healthchecks"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: ./frontend  # nginx as a non-root user, on :8080 inside the container
    restart: unless-stopped
    ports: ["8088:8080"]
    depends_on: [api]

volumes:
  pgdata:
