[project]
name = "lead-platform-api"
version = "0.1.0"
description = "Lead Segregation Platform API: ingestion, AI classification/scoring, auto-response, notifications"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiosmtplib>=5.1",
    "alembic>=1.20",
    "asyncpg>=0.32",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162,<0.163",
    "httpx>=0.28",
    "imap-tools>=1.16",
    "openai>=3.46",
    "procrastinate>=3.10",
    "pwdlib[argon2]>=0.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15",
    "sentry-sdk[fastapi]>=2.74.0",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "sse-starlette>=3.6.0",
    "structlog>=26.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "PL", "TID"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"migrations/**" = ["N999", "E402"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["procrastinate.*", "imap_tools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running Postgres",
    "live_llm: calls the real OpenAI API (off by default)",
]
