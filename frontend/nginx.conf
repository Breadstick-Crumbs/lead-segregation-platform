server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE: don't buffer the event stream
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # The MCP endpoint and its OAuth server (backend app/mcp_server PUBLIC_PATHS). Exact
  # matches, so SPA routes such as /oauth/consent still get index.html.
  location ~ ^/(mcp|authorize|token|register|revoke)$ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Tool calls and OAuth forms are small; this caps what anonymous /register can send.
    client_max_body_size 64k;
  }
  location /.well-known/oauth- {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    # The consent page must not be framed by another site (clickjacking).
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    try_files $uri /index.html;
  }
}
