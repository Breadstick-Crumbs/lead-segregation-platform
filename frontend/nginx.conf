server {
  # Unprivileged port: the image runs nginx as a non-root user.
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  # The API by a name only this stack uses: the server's shared `edge` network may hold
  # another project's `api`. Resolved through Docker's DNS at request time (a variable in
  # proxy_pass), so a recreated API container with a new address is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://lead-platform-api:8000;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE: don't buffer the event stream
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # The MCP endpoint and its OAuth server (backend app/mcp_server PUBLIC_PATHS). Exact
  # matches, so SPA routes such as /oauth/consent still get index.html.
  location ~ ^/(mcp|authorize|token|register|revoke)$ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Tool calls and OAuth forms are small; this caps what anonymous /register can send.
    client_max_body_size 64k;
  }
  location /.well-known/oauth- {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Vite fingerprints these file names, so they can be cached for good.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    # index.html names the current asset files: always revalidate it.
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
